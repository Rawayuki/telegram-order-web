<style id="dbtEmbeddedTheme">
/* =========================================================
   DBT MULTI SHOP V2 - SHARED THEME / ACCESSIBILITY / MOTION
   ========================================================= */

:root {
  color-scheme: light;
  --ui-bg: #f6f7fb;
  --ui-surface: #ffffff;
  --ui-surface-2: #f7f8fa;
  --ui-text: #171717;
  --ui-muted: #6b7280;
  --ui-line: #e5e7eb;
  --ui-dark: #111827;
  --ui-orange: #ff6b35;
  --ui-shadow: 0 12px 32px rgba(17,24,39,.08);
}

html[data-theme="dark"] {
  color-scheme: dark;
  --ui-bg: #0d1117;
  --ui-surface: #151b24;
  --ui-surface-2: #1b2330;
  --ui-text: #f3f4f6;
  --ui-muted: #a5adba;
  --ui-line: #2b3441;
  --ui-dark: #0b0f15;
  --ui-orange: #ff7a45;
  --ui-shadow: 0 12px 32px rgba(0,0,0,.28);
}

html[data-theme="dark"] body {
  background: radial-gradient(circle at 10% 12%, rgba(255,107,53,.07), transparent 28%), var(--ui-bg) !important;
  color: var(--ui-text) !important;
}

html[data-theme="dark"] .account-card,
html[data-theme="dark"] .summary-card,
html[data-theme="dark"] .order,
html[data-theme="dark"] .shop-card,
html[data-theme="dark"] .feature-card,
html[data-theme="dark"] .quick-stats,
html[data-theme="dark"] .toolbar,
html[data-theme="dark"] .product-card,
html[data-theme="dark"] .cart-panel,
html[data-theme="dark"] .cart-footer,
html[data-theme="dark"] .confirm-card,
html[data-theme="dark"] .success-card,
html[data-theme="dark"] .admin-bar,
html[data-theme="dark"] .product,
html[data-theme="dark"] .modal-box,
html[data-theme="dark"] .stat-card,
html[data-theme="dark"] .loading,
html[data-theme="dark"] .message {
  background: var(--ui-surface) !important;
  color: var(--ui-text) !important;
  border-color: var(--ui-line) !important;
}

html[data-theme="dark"] .search-user,
html[data-theme="dark"] .checkout-form,
html[data-theme="dark"] .image-manager,
html[data-theme="dark"] .order-note,
html[data-theme="dark"] .success-data {
  background: var(--ui-surface-2) !important;
  color: var(--ui-text) !important;
  border-color: var(--ui-line) !important;
}

html[data-theme="dark"] input,
html[data-theme="dark"] textarea,
html[data-theme="dark"] select {
  background: #101720 !important;
  color: var(--ui-text) !important;
  border-color: var(--ui-line) !important;
}

html[data-theme="dark"] .search-box input,
html[data-theme="dark"] .clear-search,
html[data-theme="dark"] .close-button,
html[data-theme="dark"] .confirm-close,
html[data-theme="dark"] .close,
html[data-theme="dark"] .quantity-row button,
html[data-theme="dark"] .remove-image-btn,
html[data-theme="dark"] .cancel {
  background: #222b38 !important;
  color: #f3f4f6 !important;
}

html[data-theme="dark"] .summary-card.highlight,
html[data-theme="dark"] .stat-card.orange {
  background: #2b201c !important;
  border-color: #57311f !important;
}

html[data-theme="dark"] .order-id {
  background: #222b38 !important;
  color: #c6ced9 !important;
}

html[data-theme="dark"] .section-note,
html[data-theme="dark"] .feature-card p,
html[data-theme="dark"] .feature-intro span,
html[data-theme="dark"] .product-count,
html[data-theme="dark"] .meta,
html[data-theme="dark"] .message,
html[data-theme="dark"] .order-meta,
html[data-theme="dark"] .order-date,
html[data-theme="dark"] .account-title span {
  color: var(--ui-muted) !important;
}

/* Small floating controls: clear enough for older users, still compact */
.dbt-ui-tools {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 1500;
  display: flex;
  gap: 8px;
  padding: 7px;
  border: 1px solid rgba(127,127,127,.18);
  border-radius: 16px;
  background: rgba(255,255,255,.92);
  box-shadow: 0 12px 30px rgba(17,24,39,.13);
  backdrop-filter: blur(12px);
}

html[data-theme="dark"] .dbt-ui-tools {
  background: rgba(21,27,36,.94);
  border-color: rgba(255,255,255,.10);
}

.dbt-ui-tool {
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 12px;
  background: #f1f3f6;
  color: #111827;
  cursor: pointer;
  font-size: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform .18s ease, background .18s ease;
}

html[data-theme="dark"] .dbt-ui-tool {
  background: #222b38;
  color: #f3f4f6;
}

.dbt-ui-tool:hover { transform: translateY(-2px); }
.dbt-ui-tool:focus-visible {
  outline: 3px solid rgba(255,107,53,.28);
  outline-offset: 2px;
}

/* Shared toast */
.dbt-toast {
  position: fixed;
  left: 50%;
  bottom: -90px;
  transform: translateX(-50%);
  z-index: 1800;
  max-width: min(420px, calc(100% - 28px));
  padding: 12px 17px;
  border-radius: 14px;
  background: #111827;
  color: #fff;
  font-size: 12px;
  line-height: 1.45;
  box-shadow: 0 12px 34px rgba(0,0,0,.22);
  opacity: 0;
  transition: bottom .28s ease, opacity .28s ease;
  text-align: center;
}

.dbt-toast.show {
  bottom: 76px;
  opacity: 1;
}

.dbt-toast.success { background: #166534; }
.dbt-toast.error { background: #991b1b; }

/* Favorite control foundation */
.dbt-favorite-btn {
  border: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  background: rgba(255,255,255,.94);
  color: #6b7280;
  box-shadow: 0 5px 16px rgba(0,0,0,.12);
  font-size: 19px;
  transition: transform .18s ease, color .18s ease;
}

.dbt-favorite-btn:hover { transform: scale(1.06); }
.dbt-favorite-btn.active { color: #ef4444; }

/* Generic loading skeleton utility */
.dbt-skeleton {
  position: relative;
  overflow: hidden;
  background: #e9edf2;
  border-radius: 10px;
  color: transparent !important;
}

html[data-theme="dark"] .dbt-skeleton { background: #222b38; }

.dbt-skeleton::after {
  content: "";
  position: absolute;
  inset: 0;
  transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent);
  animation: dbtShimmer 1.2s infinite;
}

@keyframes dbtShimmer {
  to { transform: translateX(100%); }
}

@keyframes dbtSoftIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

.dbt-animate-in { animation: dbtSoftIn .28s ease both; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}

@media (max-width: 650px) {
  .dbt-ui-tools {
    right: 12px;
    bottom: 12px;
  }
  .dbt-ui-tool {
    width: 42px;
    height: 42px;
  }
  .dbt-toast.show { bottom: 68px; }
}


/* =========================================================
   V2 PHASE 2 - HIGHLIGHT SECTIONS
   ========================================================= */
.v2-section {
  margin-top: 68px;
}

.v2-section-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 20px;
  margin-bottom: 18px;
}

.v2-section-head small {
  display: block;
  color: var(--ui-orange);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.2px;
  margin-bottom: 5px;
}

.v2-section-head h2 {
  font-size: 27px;
}

.v2-section-head p {
  max-width: 400px;
  color: var(--ui-muted);
  font-size: 12px;
  line-height: 1.6;
}

.v2-mini-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0,1fr));
  gap: 14px;
}

.v2-mini-card {
  position: relative;
  overflow: hidden;
  background: var(--ui-surface);
  color: var(--ui-text);
  border: 1px solid var(--ui-line);
  border-radius: 16px;
  box-shadow: var(--ui-shadow);
  min-width: 0;
}

.v2-mini-card img {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  display: block;
  background: #e9edf2;
}

.v2-mini-body {
  padding: 13px;
}

.v2-mini-body strong {
  display: block;
  font-size: 14px;
  line-height: 1.35;
}

.v2-mini-body span {
  display: block;
  color: var(--ui-muted);
  font-size: 11px;
  margin-top: 5px;
}

.v2-mini-link {
  text-decoration: none;
  color: inherit;
}

.v2-badge {
  position: absolute;
  top: 9px;
  left: 9px;
  z-index: 2;
  padding: 6px 9px;
  border-radius: 30px;
  background: #111827;
  color: white;
  font-size: 9px;
  font-weight: 800;
  box-shadow: 0 5px 14px rgba(0,0,0,.14);
}

.v2-badge.hot { background: #dc2626; }
.v2-badge.today { background: #ff6b35; }

.v2-promo {
  margin-top: 62px;
  border-radius: 22px;
  overflow: hidden;
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  background: linear-gradient(120deg,#ff6b35,#ff8d61);
  color: white;
  box-shadow: 0 18px 44px rgba(255,107,53,.18);
}

.v2-promo-main {
  padding: 31px;
}

.v2-promo-main small {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.2px;
  opacity: .85;
}

.v2-promo-main h2 {
  margin-top: 7px;
  font-size: 29px;
}

.v2-promo-code {
  display: inline-flex;
  margin-top: 15px;
  padding: 10px 14px;
  border-radius: 11px;
  background: white;
  color: #d94f1f;
  font-weight: 900;
  letter-spacing: 1px;
  cursor: pointer;
}

.v2-expired {
  padding: 28px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: rgba(17,24,39,.16);
}

.v2-expired strong {
  font-size: 18px;
  text-decoration: line-through;
}

.v2-expired span {
  margin-top: 6px;
  font-size: 12px;
  opacity: .86;
}

.v2-empty {
  grid-column: 1/-1;
  padding: 24px;
  border: 1px dashed var(--ui-line);
  border-radius: 15px;
  color: var(--ui-muted);
  text-align: center;
  background: var(--ui-surface);
}

.product-highlight-row {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.product-highlight-tag {
  display: inline-block;
  padding: 4px 7px;
  border-radius: 30px;
  font-size: 9px;
  font-weight: 800;
  background: #fff1eb;
  color: #d94f1f;
}

html[data-theme="dark"] .product-highlight-tag {
  background: #332219;
  color: #ff9b73;
}

@media(max-width:800px){
  .v2-mini-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:600px){
  .v2-section{margin-top:48px}
  .v2-section-head{flex-direction:column;align-items:flex-start}
  .v2-section-head h2{font-size:24px}
  .v2-mini-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .v2-mini-body{padding:10px}
  .v2-promo{grid-template-columns:1fr}
  .v2-promo-main,.v2-expired{padding:23px}
  .v2-promo-main h2{font-size:24px}
}


/* =========================================================
   V2 COUPON / SHIPPING PLAYGROUND
   ========================================================= */

.coupon-panel {

}

.checkout-breakdown {

}

.checkout-breakdown-line {

.checkout-breakdown-line strong {

.checkout-breakdown-line.discount strong {

</style>

<script id="dbtEmbeddedUI">
/* =========================================================
   DBT MULTI SHOP V2 - SHARED UI ENGINE
   Theme / Sound / Toast / Favorites / Recently Viewed
   ========================================================= */

(function () {
  "use strict";

  const KEYS = {
    theme: "dbt_theme",
    sound: "dbt_sound",
    favorites: "dbt_favorites_v1",
    recent: "dbt_recent_v1"
  };

  const safeJSON = (raw, fallback) => {
    try { return JSON.parse(raw); }
    catch (_) { return fallback; }
  };

  const storage = {
    get(key, fallback = null) {
      try {
        const value = localStorage.getItem(key);
        return value === null ? fallback : value;
      } catch (_) { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(key, value); }
      catch (_) {}
    }
  };

  /* -------------------------
     THEME
  ------------------------- */

  const theme = {
    get() {
      const saved = storage.get(KEYS.theme);
      if (saved === "dark" || saved === "light") return saved;

      return window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
    },

    apply(value) {
      const next = value === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = next;
      storage.set(KEYS.theme, next);

      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", next === "dark" ? "#0d1117" : "#111827");

      const btn = document.getElementById("dbtThemeToggle");
      if (btn) {
        btn.textContent = next === "dark" ? "☀️" : "🌙";
        btn.setAttribute(
          "aria-label",
          next === "dark" ? "เปลี่ยนเป็นโหมดสว่าง" : "เปลี่ยนเป็นโหมดมืด"
        );
        btn.title = next === "dark" ? "โหมดสว่าง" : "โหมดมืด";
      }

      window.dispatchEvent(new CustomEvent("dbt:theme", { detail: { theme: next } }));
    },

    toggle() {
      this.apply(this.get() === "dark" ? "light" : "dark");
    }
  };

  /* -------------------------
     SOUND
  ------------------------- */

  const sound = {
    enabled() {
      return storage.get(KEYS.sound, "on") !== "off";
    },

    set(enabled) {
      storage.set(KEYS.sound, enabled ? "on" : "off");
      this.syncButton();
    },

    toggle() {
      this.set(!this.enabled());
      toast(this.enabled() ? "เปิดเสียงแล้ว 🔊" : "ปิดเสียงแล้ว 🔇");
      if (this.enabled()) this.play("tap");
    },

    syncButton() {
      const btn = document.getElementById("dbtSoundToggle");
      if (!btn) return;

      btn.textContent = this.enabled() ? "🔊" : "🔇";
      btn.setAttribute(
        "aria-label",
        this.enabled() ? "ปิดเสียงเอฟเฟกต์" : "เปิดเสียงเอฟเฟกต์"
      );
      btn.title = this.enabled() ? "ปิดเสียง" : "เปิดเสียง";
    },

    play(type = "tap") {
      if (!this.enabled()) return;

      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;

        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        const config = {
          tap: [520, .045, .035],
          favorite: [660, .07, .04],
          success: [760, .12, .045],
          remove: [320, .05, .03]
        }[type] || [520, .045, .035];

        osc.type = "sine";
        osc.frequency.value = config[0];

        gain.gain.setValueAtTime(config[2], ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + config[1]);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + config[1]);
        osc.onended = () => ctx.close();
      } catch (_) {}
    }
  };

  /* -------------------------
     TOAST
  ------------------------- */

  let toastTimer = null;

  function ensureToast() {
    let el = document.getElementById("dbtGlobalToast");

    if (!el) {
      el = document.createElement("div");
      el.id = "dbtGlobalToast";
      el.className = "dbt-toast";
      el.setAttribute("role", "status");
      el.setAttribute("aria-live", "polite");
      document.body.appendChild(el);
    }

    return el;
  }

  function toast(message, type = "") {
    const el = ensureToast();

    clearTimeout(toastTimer);
    el.textContent = String(message || "");
    el.className = `dbt-toast ${type}`.trim();

    requestAnimationFrame(() => el.classList.add("show"));

    toastTimer = setTimeout(() => {
      el.classList.remove("show");
    }, 1900);
  }

  /* -------------------------
     FAVORITES
     item = {type:"shop"|"product", id, name, image, ...}
  ------------------------- */

  const favorites = {
    all() {
      return safeJSON(storage.get(KEYS.favorites, "[]"), []);
    },

    save(items) {
      storage.set(KEYS.favorites, JSON.stringify(items));
      window.dispatchEvent(new CustomEvent("dbt:favorites", { detail: { items } }));
    },

    has(type, id) {
      return this.all().some(
        item => item.type === String(type) && String(item.id) === String(id)
      );
    },

    toggle(item) {
      if (!item || !item.type || item.id === undefined || item.id === null) return false;

      const items = this.all();
      const index = items.findIndex(
        x => x.type === String(item.type) && String(x.id) === String(item.id)
      );

      let active;

      if (index >= 0) {
        items.splice(index, 1);
        active = false;
        sound.play("remove");
      } else {
        items.unshift({
          ...item,
          type: String(item.type),
          id: String(item.id),
          saved_at: new Date().toISOString()
        });
        active = true;
        sound.play("favorite");
      }

      this.save(items.slice(0, 100));
      toast(active ? `เพิ่ม ${item.name || "รายการ"} ในรายการโปรด ❤️` : `นำ ${item.name || "รายการ"} ออกจากรายการโปรด`);

      return active;
    },

    byType(type) {
      return this.all().filter(item => item.type === String(type));
    }
  };

  /* -------------------------
     RECENTLY VIEWED
  ------------------------- */

  const recent = {
    all() {
      return safeJSON(storage.get(KEYS.recent, "[]"), []);
    },

    add(item) {
      if (!item || !item.type || item.id === undefined || item.id === null) return;

      let items = this.all().filter(
        x => !(x.type === String(item.type) && String(x.id) === String(item.id))
      );

      items.unshift({
        ...item,
        type: String(item.type),
        id: String(item.id),
        viewed_at: new Date().toISOString()
      });

      items = items.slice(0, 20);
      storage.set(KEYS.recent, JSON.stringify(items));
      window.dispatchEvent(new CustomEvent("dbt:recent", { detail: { items } }));
    },

    byType(type) {
      return this.all().filter(item => item.type === String(type));
    },

    clear() {
      storage.set(KEYS.recent, "[]");
      window.dispatchEvent(new CustomEvent("dbt:recent", { detail: { items: [] } }));
    }
  };

  /* -------------------------
     ACCESSIBLE FLOATING CONTROLS
  ------------------------- */

  function injectTools() {
    if (document.getElementById("dbtUiTools")) return;

    const wrap = document.createElement("div");
    wrap.className = "dbt-ui-tools";
    wrap.id = "dbtUiTools";
    wrap.innerHTML = `
      <button type="button" class="dbt-ui-tool" id="dbtThemeToggle" aria-label="เปลี่ยนธีม">🌙</button>
      <button type="button" class="dbt-ui-tool" id="dbtSoundToggle" aria-label="เปิดหรือปิดเสียง">🔊</button>
    `;

    document.body.appendChild(wrap);

    document.getElementById("dbtThemeToggle").addEventListener("click", () => {
      theme.toggle();
      sound.play("tap");
    });

    document.getElementById("dbtSoundToggle").addEventListener("click", () => {
      sound.toggle();
    });

    theme.apply(theme.get());
    sound.syncButton();
  }

  function init() {
    theme.apply(theme.get());

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", injectTools, { once: true });
    } else {
      injectTools();
    }
  }

  window.DBTUI = {
    init,
    theme,
    sound,
    toast,
    favorites,
    recent,
    storage
  };

  init();
})();

</script>
<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbzialSfP1raLPbLYIt7VNCYx4znrmq5-fnKbwEGkIbsnxy95fzFOnwgXFyexywvTGXr/exec";

let filterType="all";
let liveShops=[];
let liveProducts=[];

async function loadReferenceData(){
 try{
  const [shopsResponse,productsResponse]=await Promise.all([
   fetch(`${API_URL}?action=shops`),
   fetch(`${API_URL}?action=products`)
  ]);

  const shopsResult=await shopsResponse.json();
  const productsResult=await productsResponse.json();

  liveShops=shopsResult.success&&Array.isArray(shopsResult.data)
   ?shopsResult.data:[];
  liveProducts=productsResult.success&&Array.isArray(productsResult.data)
   ?productsResult.data:[];

 }catch(error){
  console.warn("Reference data unavailable:",error);
 }
}

function refreshedFavorite(item){
 if(item.type==="shop"){
  const shop=liveShops.find(s=>String(s.shop_id)===String(item.id));
  if(shop){
   return {...item,name:shop.shop_name,image:shop.image,active:shop.active,description:shop.description||""};
  }
 }

 if(item.type==="product"){
  const product=liveProducts.find(p=>String(p.product_id)===String(item.id));
  if(product){
   const shop=liveShops.find(s=>String(s.shop_id)===String(product.shop_id));
   return {
    ...item,
    name:product.name,
    image:product.image,
    price:Number(product.price||0),
    shop_id:product.shop_id,
    shop_name:shop?shop.shop_name:(item.shop_name||product.shop_id),
    active:product.active
   };
  }
 }

 return item;
}

function isEnabled(value){
 return value===undefined||
        value===true||
        String(value).toUpperCase()==="TRUE";
}

function renderFavorites(){
 const grid=document.getElementById("favoriteGrid");

 if(!window.DBTUI){
  grid.innerHTML=`<div class="empty"><strong>โหลดระบบรายการโปรดไม่สำเร็จ</strong>ตรวจสอบไฟล์ app-ui.js</div>`;
  return;
 }

 let items=DBTUI.favorites.all().map(refreshedFavorite);

 if(filterType!=="all"){
  items=items.filter(item=>item.type===filterType);
 }

 document.getElementById("favoriteCount").textContent=`${items.length} รายการ`;

 if(!items.length){
  grid.innerHTML=`
   <div class="empty">
    <strong>ยังไม่มีรายการโปรด ❤️</strong>
    กดหัวใจที่ร้านหรือสินค้าที่ชอบ แล้วรายการจะมาอยู่ตรงนี้
   </div>`;
  return;
 }

 grid.innerHTML=items.map(item=>{
  const isShop=item.type==="shop";
  const href=isShop
   ?`shop.html?shop_id=${encodeURIComponent(item.id)}&shop_name=${encodeURIComponent(item.name||"ร้านค้า")}`
   :`shop.html?shop_id=${encodeURIComponent(item.shop_id||"")}&shop_name=${encodeURIComponent(item.shop_name||item.shop_id||"ร้านค้า")}`;

  const enabled=isEnabled(item.active);

  return `
   <article class="card dbt-animate-in">
    <img
     src="${item.image||'https://placehold.co/600x600?text=Favorite'}"
     alt="${item.name||'รายการโปรด'}"
     onerror="this.src='https://placehold.co/600x600?text=Favorite'"
    >

    <div class="card-body">
     <div class="card-type">${isShop?"FAVORITE SHOP":"FAVORITE PRODUCT"}</div>
     <h3>${item.name||"-"}</h3>

     <p>
      ${isShop
       ?`${enabled?"🟢 เปิดร้าน":"🔴 ปิดร้าน"}${item.description?` · ${item.description}`:""}`
       :`${item.shop_name||item.shop_id||"ร้านค้า"} · ฿${Number(item.price||0).toLocaleString()}${enabled?"":" · ปิดขาย"}`
      }
     </p>

     <div class="card-actions">
      <a class="open-btn" href="${href}">${isShop?"เข้าร้าน":"ดูสินค้า"} →</a>
      <button class="remove-btn" onclick="removeFavorite('${item.type}','${String(item.id)}')" title="นำออกจากรายการโปรด">♥</button>
     </div>
    </div>
   </article>`;
 }).join("");
}

function removeFavorite(type,id){
 if(!window.DBTUI)return;

 const item=DBTUI.favorites.all().find(
  x=>x.type===type&&String(x.id)===String(id)
 );

 if(item){
  DBTUI.favorites.toggle(item);
  renderFavorites();
 }
}

function setFilter(type,button){
 filterType=type;
 document.querySelectorAll(".tab").forEach(tab=>tab.classList.remove("active"));
 button.classList.add("active");
 renderFavorites();
}

window.addEventListener("dbt:favorites",renderFavorites);

async function startFavorites(){
 await loadReferenceData();
 renderFavorites();
}

startFavorites();
</script>
<script src="app-pwa.js"></script>
