<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>ออฟไลน์ · DBT Multi Shop</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#111827;color:white;font-family:Arial,"Noto Sans Thai",sans-serif}
.card{width:min(520px,100%);padding:34px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:#172033;box-shadow:0 30px 80px rgba(0,0,0,.28);text-align:center}
.icon{font-size:64px}.tag{margin-top:18px;color:#ff9b73;font-size:10px;font-weight:900;letter-spacing:1px}
h1{margin:7px 0 0;font-size:32px}p{color:#cbd5e1;line-height:1.7;font-size:13px}
button{margin-top:18px;border:0;border-radius:12px;background:#ff6b35;color:#fff;padding:12px 17px;font-weight:900;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<div class="icon">📡</div>
<div class="tag">DBT MULTI SHOP</div>
<h1>ตอนนี้ไม่มีอินเทอร์เน็ต</h1>
<p>หน้าเว็บหลักยังเปิดจากแคชได้บางส่วน แต่ข้อมูลสด เช่น ร้านค้า ออเดอร์ รีวิว และงานไรเดอร์ ต้องเชื่อมอินเทอร์เน็ตก่อน</p>
<button onclick="location.reload()">ลองเชื่อมต่ออีกครั้ง</button>
</div>
</body>
</html>
